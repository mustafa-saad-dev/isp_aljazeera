name: isp_aljazeera
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  equatable: ^2.0.7
  go_router: ^15.1.2
  dio: ^5.7.0
  flutter_secure_storage: ^11.0.0
  connectivity_plus: ^6.1.0
  # firebase_core: ^3.8.0
  # firebase_messaging: ^15.1.6
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  shared_preferences: ^2.3.2

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  image_picker: ^1.2.3
  flutter_image_compress: ^2.0.0
  cached_network_image: ^3.4.1
  web: ^1.0.0
  pull_to_refresh_flutter3: ^2.0.2
  toastification: ^3.2.0
  hugeicons: ^0.0.7
  url_launcher: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lang/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Tajawal-Light.ttf
          weight: 300
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Tajawal-Black.ttf
          weight: 900