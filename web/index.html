<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="description" content="Subnex - إدارة اشتراكات وكلاء الإنترنت">
  <meta name="theme-color" content="#F26522">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Subnex">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.ico" />

  <title>Subnex</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
  <link rel="stylesheet" href="theme/colors.css">
  <link rel="stylesheet" href="theme/loading-root.css">


</head>

<body>
  <div id="app-loading">
    <div class="stage">
      <svg class="orbit" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <circle cx="60" cy="10" r="4" />
        <circle cx="85" cy="16.7" r="4" />
        <circle cx="103.3" cy="35" r="4" />
        <circle cx="110" cy="60" r="4" />
        <circle cx="103.3" cy="85" r="4" />
        <circle cx="85" cy="103.3" r="4" />
        <circle cx="60" cy="110" r="4" />
        <circle cx="35" cy="103.3" r="4" />
        <circle cx="16.7" cy="85" r="4" />
        <circle cx="10" cy="60" r="4" />
        <circle cx="16.7" cy="35" r="4" />
        <circle cx="35" cy="16.7" r="4" />
      </svg>
      <img class="logo" src="icons/icon-512.png" alt="Subnex" width="96" height="96" />
    </div>

    <div class="wordmark">My Net</div>
    <div class="tagline">جاري التحميل</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('app-loading');
      if (loading) {
        loading.style.display = 'none';
      }
    });
  </script>
</body>

</html>
